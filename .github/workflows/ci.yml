name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Test on iOS Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E '^\s+iPhone' | sed -E 's/^[[:space:]]*(.*) \([-A-F0-9]+\).*/\1/')
          echo "Using simulator: $DEVICE"
          xcodebuild -quiet -scheme DodoCheckout -destination "platform=iOS Simulator,name=$DEVICE" test
